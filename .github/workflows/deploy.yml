name: Deploy Ideal Gifting Backend

on:
  push:
    branches:
      - main

# Prevent two deployments from running against the VPS at the same time
# (e.g. two quick pushes to main). New runs queue behind the current one
# rather than cancelling it mid-migration/restart.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify secrets exist
        run: |
          [ -z "${{ secrets.VPS_HOST }}" ] && echo "❌ VPS_HOST empty" || echo "✅ VPS_HOST present"
          [ -z "${{ secrets.VPS_USER }}" ] && echo "❌ VPS_USER empty" || echo "✅ VPS_USER present"
          [ -z "${{ secrets.VPS_PORT }}" ] && echo "❌ VPS_PORT empty" || echo "✅ VPS_PORT present"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ] && echo "❌ VPS_SSH_KEY empty" || echo "✅ VPS_SSH_KEY present"

      - name: Setup SSH (GitHub Actions -> VPS)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          echo "Connecting to $VPS_USER@$VPS_HOST on port $VPS_PORT"

          # The remote script (.github/scripts/deploy_remote.sh, checked
          # out onto this runner above) is piped over SSH as stdin to a
          # login shell on the VPS - nothing in it is expanded by this
          # runner's shell, it all runs on the VPS itself.
          ssh -i ~/.ssh/id_ed25519 \
            -p "$VPS_PORT" \
            "$VPS_USER@$VPS_HOST" bash -s < .github/scripts/deploy_remote.sh
